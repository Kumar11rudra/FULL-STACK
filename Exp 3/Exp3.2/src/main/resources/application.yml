spring:
  application:
    name: exp3-2-ci-cd
  datasource:
    url: jdbc:h2:mem:exp32;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
management:
  endpoints:
    web:
      exposure:
        include: health,info
app:
  version: ${APP_VERSION:dev}
