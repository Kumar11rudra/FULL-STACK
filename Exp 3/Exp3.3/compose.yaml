services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: exp33
      POSTGRES_USER: exp33
      POSTGRES_PASSWORD: exp33_dev_password
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U exp33 -d exp33"]
      interval: 5s
      timeout: 5s
      retries: 12
  kafka:
    image: apache/kafka:3.8.0
    hostname: kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --list >/dev/null 2>&1"]
      interval: 8s
      timeout: 8s
      retries: 20
  backend:
    build: ./backend
    depends_on:
      db: { condition: service_healthy }
      kafka: { condition: service_healthy }
    environment:
      DB_URL: jdbc:postgresql://db:5432/exp33
      DB_USER: exp33
      DB_PASSWORD: exp33_dev_password
      KAFKA_BOOTSTRAP: kafka:29092
      CORS_ORIGIN: http://localhost:5173
      APP_JWT_SECRET_BASE64: ${APP_JWT_SECRET_BASE64:-ZGV2LW9ubHktc2VjcmV0LWV4cDMzLW5vdC1mb3ItcHJvZHVjdGlvbiE=}
    ports:
      - "8080:8080"
  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "3000:80"
volumes:
  pgdata:
