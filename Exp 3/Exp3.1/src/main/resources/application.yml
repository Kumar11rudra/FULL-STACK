server:
  port: 8080

spring:
  application:
    name: exp3-1-kafka-reliability
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      properties:
        enable.idempotence: true
    consumer:
      group-id: scheduled-posts-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.example.kafkareliability.model
        spring.json.value.default.type: com.example.kafkareliability.model.PostEvent
    listener:
      ack-mode: record
  datasource:
    url: jdbc:h2:file:./data/processed-posts;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

logging:
  level:
    com.example.kafkareliability: INFO
